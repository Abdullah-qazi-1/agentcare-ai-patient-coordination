[project]
name = "agentcare"
version = "1.0.0"
description = "Agentic AI for patient administration and care coordination — AgentCare Build Challenge 2026"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    # ---- Agentic AI / LLM (LangChain v1 + LangGraph v1) ----
    "langchain>=1.3.14,<2",
    "langchain-openai>=1.4.1,<2",
    "langchain-core>=1.4.7,<2",
    "langgraph>=1.2.9,<2",
    "langgraph-checkpoint-sqlite>=3.1.0,<4",
    "langsmith>=0.4.0",
    # ---- Observability ----
    "logfire[fastapi,httpx,sqlalchemy,system-metrics]>=4.39.0",
    # ---- Web framework ----
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "jinja2>=3.1.4",
    # ---- Settings & validation ----
    "pydantic[email]>=2.10.4",
    "pydantic-settings>=2.7.1",
    # ---- Database ----
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    # ---- Auth ----
    "pyjwt>=2.10.1",
    "bcrypt>=4.2.1",
    # ---- Utilities ----
    "httpx>=0.28.1",
    "structlog>=24.4.0",
    "pypdf>=6.14.2",
    "nemoguardrails>=0.23.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2.3", "langgraph-checkpoint-postgres>=3.0.0"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.6",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "UP042",  # str+Enum -> StrEnum would change str()/format() output; not pure style
]

[tool.ruff.lint.per-file-ignores]
# Alembic revisions are a historical record of what actually ran — not to be reformatted
# after the fact, even for line length.
"alembic/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
# AgentCare is a deployed application, not a distributable library — uv manages the
# environment without building the project itself into a wheel.
package = false
