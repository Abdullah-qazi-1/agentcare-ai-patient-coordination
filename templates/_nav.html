{% from "macros/logo.html" import logo %}
<header class="appbar">
  <div class="appbar-inner">
    <a class="brand" href="/">{{ logo(28) }}<span>AgentCare</span></a>

    <nav class="nav-desktop">
      {% for item in nav_items %}
        <a href="{{ item.to }}" class="nav-link{% if request.url.path == item.to %} active{% endif %}">{{ item.label }}</a>
      {% endfor %}
    </nav>

    <div class="nav-user">
      <span class="user-chip">
        <span class="avatar">{{ current_user.name[0] | upper }}</span>
        <span class="user-meta">
          <strong>{{ current_user.name }}</strong>
          <small>{{ current_user.role.value | prettify }}</small>
        </span>
      </span>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="btn btn-ghost">Log out</button>
      </form>
    </div>

    <button class="nav-toggle" type="button" aria-label="Toggle menu" aria-expanded="false" data-nav-toggle>&#9776;</button>
  </div>

  <nav class="nav-mobile" id="mobile-nav">
    {% for item in nav_items %}
      <a href="{{ item.to }}"{% if request.url.path == item.to %} class="active"{% endif %}>{{ item.label }}</a>
    {% endfor %}
  </nav>
</header>
